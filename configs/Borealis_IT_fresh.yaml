wandb:
  entity: "vikhr-audio"
  project: "Borealis-IT-Fresh"

datasets:
  mode: "instruct"

  train:
    # Main IT datasets
    - name: "Vikhrmodels/Speech-Instructions"
      split: "train"
      columns: ["audio", "question", "answer"]
      question_column: "question"
      answer_column: "answer"
      audio_column: "audio"
    - name: "Vikhrmodels/AudioBooksInstructGemini2.5"
      split: "train"
      columns: ["audio", "question", "answer"]
      question_column: "question"
      answer_column: "answer"
      audio_column: "audio"
    # ASR data (more data for adapter training)
    - name: "Vikhrmodels/ToneBooksPlus"
      split: "train"
      columns: ["audio", "text"]
      audio_column: "audio"
      answer_column: "text"
      static_question: "Transcribe the audio."
      select_range: 100000
    - name: "Vikhrmodels/ToneSpeak"
      split: "train"
      columns: ["audio", "text"]
      audio_column: "audio"
      answer_column: "text"
      static_question: "Transcribe the audio."
      select_range: 100000
    - name: "Vikhrmodels/ToneRuLS"
      split: "train"
      columns: ["audio", "text"]
      audio_column: "audio"
      answer_column: "text"
      static_question: "Transcribe the audio."
      select_range: 100000
    - name: "Vikhrmodels/ToneRuDevices"
      split: "train"
      columns: ["audio", "text"]
      audio_column: "audio"
      answer_column: "text"
      static_question: "Transcribe the audio."
      select_range: 50000
  val:
    - name: "Vikhrmodels/Speech-Instructions"
      split: "train"
      columns: ["audio", "question", "answer"]
      question_column: "question"
      answer_column: "answer"
      audio_column: "audio"
      select_range: 200

  # Text-only instruction data (100k Russian)
  text_train:
    - name: "Vikhrmodels/GrandMaster-PRO-MAX"
      split: "train"
      select_range: 100000
      filter_lang: "ru"

  noise:
    name: "Vikhrmodels/Audio_Noise_Dataset"
    split: "Musan"
  ir:
    name: "Vikhrmodels/Audio_Noise_Dataset"
    split: "Echo"

  num_proc: 8
  sampling_rate: 16000

model:
  whisper:
    pretrained: "openai/whisper-large-v3"
    dtype: "bfloat16"
  language_model:
    pretrained: "Qwen/Qwen3-4B"
    full_finetuning: false  # Train only adapter, freeze LLM
  # No checkpoint - start fresh
  special_tokens:
    start_audio: "<|start_of_audio|>"
    end_audio: "<|end_of_audio|>"
  max_text_len: 1024

instruct:
  default_system_prompt: "You are a helpful voice assistant. Listen to the audio and respond appropriately."

augmentation:
  sample_rate: 16000
  stages: "default"

training:
  output_dir: "./borealis_adapter_only"
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8  # 8 GPUs x 1 batch x 8 accum = 64 effective
  dataloader_num_workers: 8
  save_total_limit: 5
  num_train_epochs: 3
  warmup_ratio: 0.03
  learning_rate: 1e-4  # Higher LR for adapter-only training
  bf16: true
  eval_strategy: "steps"
  save_strategy: "steps"
  eval_steps: 1000
  save_steps: 2000
  logging_steps: 10
  report_to: "wandb"
  run_name: "borealis_adapter_only"
  save_safetensors: false
  optim: "adamw_torch"
  lr_scheduler_type: "cosine"
  gradient_checkpointing: false

generation:
  max_new_tokens: 512
  do_sample: true
  temperature: 0.7
  top_p: 0.9
  repetition_penalty: 1.1

metrics:
  random_samples: 5
