wandb:
  entity: "vikhr-audio"
  project: "Borealis-Instruct"


datasets:
  mode: "instruct"  # instruct or pretrain


  train:
    - name: "Vikhrmodels/Speech-Instructions"
      split: "train"
      columns: ["audio", "question", "answer"]
      question_column: "question"
      answer_column: "answer"
      audio_column: "audio"
      select_range: 70000
    - name: "Vikhrmodels/Speech-Describe"
      split: "500k_part1_speech"
      columns: ["audio", "question", "answer"]
      question_column: "question"
      answer_column: "answer"
      audio_column: "audio"
    - name: "Vikhrmodels/Speech-Describe"
      split: "500k_part2_speech"
      columns: ["audio", "question", "answer"]
      question_column: "question"
      answer_column: "answer"
      audio_column: "audio"
    - name: "Vikhrmodels/Speech-Describe"
      split: "500k_part1_nonspeech"
      columns: ["audio", "question", "answer"]
      question_column: "question"
      answer_column: "answer"
      audio_column: "audio"
    - name: "Vikhrmodels/Speech-Describe"
      split: "500k_part2_nonspeech"
      columns: ["audio", "question", "answer"]
      question_column: "question"
      answer_column: "answer"
      audio_column: "audio"
    - name: "Vikhrmodels/ToneBooks"
      split: "train"
      columns: ["audio", "text"]
      answer_column: "text"
      audio_column: "audio"
      static_question: "Что слышно на аудио?"
    - name: "Vikhrmodels/AudioBooksInstructGemini2.5"
      split: "train"
      columns: ["audio", "question", "answer"]
      question_column: "question"
      answer_column: "answer"
      audio_column: "audio"

  val:
    - name: "Vikhrmodels/Speech-Instructions"
      split: "train"
      columns: ["audio", "question", "answer"]
      question_column: "question"
      answer_column: "answer"
      audio_column: "audio"
      select_range: 100

  noise:
    name: "Vikhrmodels/Audio_Noise_Dataset"
    split: "Musan"
  ir:
    name: "Vikhrmodels/Audio_Noise_Dataset"
    split: "Echo"

  num_proc: 8
  sampling_rate: 16000

model:
  whisper:
    pretrained: "openai/whisper-large-v3"
    dtype: "bfloat16"
  language_model:
    pretrained: "./models/Qwen3-4B"
    full_finetuning: true
  checkpoint_path: "checkpoints/pytorch_model.bin"
  special_tokens:
    start_audio: "<|start_of_audio|>"
    end_audio: "<|end_of_audio|>"
  max_text_len: 1024

instruct:
  default_system_prompt: "You are a helpful voice assistant. Listen to the audio and respond appropriately."

augmentation:
  sample_rate: 16000
  stages: "default"

training:
  output_dir: "./borealis_ru_it"
  resume_from_checkpoint: "./borealis_ru_it/checkpoint-300"
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  dataloader_num_workers: 8
  save_total_limit: 5
  num_train_epochs: 3
  warmup_ratio: 0.03
  learning_rate: 2e-5
  bf16: true
  eval_strategy: "steps"
  save_strategy: "steps"
  eval_steps: 1000
  save_steps: 300
  logging_steps: 10
  report_to: "wandb"
  save_safetensors: false
  optim: "adamw_torch"
  lr_scheduler_type: "cosine"
  gradient_checkpointing: false

generation:
  max_new_tokens: 512
  do_sample: true
  temperature: 0.7
  top_p: 0.9
  repetition_penalty: 1.1

metrics:
  random_samples: 3
